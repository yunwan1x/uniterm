<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#142132;color:white;font:32px sans-serif}header{position:fixed;top:0;left:0;padding:20px;background:#143a62;z-index:1}canvas{display:block;margin:110px 0 30px 80px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:25px;padding:30px}.card{height:280px;background:linear-gradient(135deg,#17a8ce,#143a62 45%,#db7245);border:4px solid #abd}</style><header>uniTerm controlled RDP animation and scrolling</header><canvas width="1280" height="720"></canvas><div class="cards"></div><script>
for(let i=0;i<120;i++){const e=document.createElement('div');e.className='card';e.textContent='Content '+i;document.querySelector('.cards').append(e)}
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let n=0;function render(){n++;ctx.fillStyle='#233f53';ctx.fillRect(0,0,1280,720);for(let y=0;y<6;y++){ctx.fillStyle=['#f46643','#17b89e','#5293ef'][y%3];ctx.fillRect((n*8+y*137)%1400-100,y*120,240,100)}ctx.fillStyle='white';ctx.font='60px sans-serif';ctx.fillText('Frame '+n,100,350);requestAnimationFrame(render)}render();let s=0;setInterval(()=>{scrollTo({top:++s%2?700:0,behavior:'smooth'})},2200);
const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=440;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();a.resume();
</script>
